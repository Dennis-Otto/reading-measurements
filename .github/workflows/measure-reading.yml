name: measure reading
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  discussions: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read the planted texts by number and print numbers only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          """Reads by number of the planted texts; prints one JSON line of numbers for each request.

          It prints, for each request: a fixed label, the status, a fixed shape code, the bytes
          and the seconds; for each rendering: a key, its length and the first 16 hex digits of
          SHA-256 hashes. It prints no text of an answer and no token.
          """
          import gzip
          import hashlib
          import http.client
          import json
          import os
          import re
          import sys
          import time
          import zlib

          REPO = os.environ.get("REPO", "Dennis-Otto/reading-measurements")
          OWNER, NAME = REPO.split("/")
          TOKEN = os.environ["GH_TOKEN"]
          TRIES = int(os.environ.get("TRIES", "2"))
          R = "/repos/" + REPO
          HTML = "application/vnd.github.html+json"
          DEFAULT = "application/vnd.github+json"
          HEX32 = re.compile(r"[0-9a-f]{32}")
          ATTRS = re.compile(r"<([a-zA-Z0-9-]+)(\s[^>]*)?>")
          TAGS = re.compile(r"<[^>]+>")
          SPACE = re.compile(r"\s+")


          def h16(s):
              return hashlib.sha256(s.encode("utf-8")).hexdigest()[:16]


          def hashes(key, s):
              """The key, the length, the hash, and the hashes with the 32-hex ids evened out,
              without attributes, and of the text between the tags."""
              if not isinstance(s, str):
                  return [key, None]
              return [key, len(s.encode("utf-8")), h16(s), h16(HEX32.sub("X", s)),
                      h16(ATTRS.sub(r"<\1>", HEX32.sub("X", s))), h16(SPACE.sub(" ", TAGS.sub("", s)).strip())]


          def request(method, path, accept=DEFAULT, body=None):
              headers = {"Authorization": "Bearer " + TOKEN, "Accept": accept, "Accept-Encoding": "gzip",
                         "User-Agent": "reading-measurements", "X-GitHub-Api-Version": "2022-11-28"}
              if body is not None:
                  headers["Content-Type"] = "application/json"
              rec = {}
              t0 = time.perf_counter()
              conn = http.client.HTTPSConnection("api.github.com", timeout=60)
              data = b""
              try:
                  conn.request(method, path, body=body, headers=headers)
                  resp = conn.getresponse()
                  rec["ttfb"] = round(time.perf_counter() - t0, 3)
                  rec["status"] = resp.status
                  h = {k.lower(): v for k, v in resp.getheaders()}
                  try:
                      wire = resp.read()
                  except http.client.IncompleteRead as e:
                      wire = e.partial
                      rec["cut"] = 1
                  except Exception as e:  # a broken read is a result, not an end
                      wire = b""
                      rec["read_error"] = type(e).__name__
                  rec["s"] = round(time.perf_counter() - t0, 3)
                  rec["wire"] = len(wire)
                  rec["gzip"] = 1 if h.get("content-encoding") == "gzip" else 0
                  rec["rl"] = [h.get("x-ratelimit-resource"), h.get("x-ratelimit-limit"), h.get("x-ratelimit-remaining")]
                  data = wire
                  if rec["gzip"] and wire:
                      try:
                          data = gzip.decompress(wire)
                      except (OSError, EOFError, zlib.error):
                          rec["gzip_error"] = 1
                          try:
                              data = zlib.decompressobj(16 + zlib.MAX_WBITS).decompress(wire)
                          except zlib.error:
                              data = b""
              except Exception as e:
                  rec["s"] = round(time.perf_counter() - t0, 3)
                  rec["status"] = None
                  rec["error"] = type(e).__name__
              finally:
                  conn.close()
              rec["bytes"] = len(data)
              obj = None
              if not data:
                  rec["shape"] = "empty"
              else:
                  try:
                      obj = json.loads(data)
                      rec["shape"] = "ok" if rec.get("status") == 200 else "http-%s" % rec.get("status")
                  except ValueError:
                      rec["shape"] = "not-json"
              return rec, obj


          def graphql(query, variables=None):
              rec, obj = request("POST", "/graphql", body=json.dumps({"query": query, "variables": variables or {}}).encode())
              if isinstance(obj, dict):
                  if obj.get("errors"):
                      rec["errors"] = len(obj["errors"])
                      rec["shape"] = "errors-data-null" if obj.get("data") is None else "errors-with-data"
                  elif obj.get("data") is None:
                      rec["shape"] = "data-null"
                  rl = (obj.get("data") or {}).get("rateLimit") if isinstance(obj.get("data"), dict) else None
                  if rl:
                      rec["cost"], rec["gql_remaining"], rec["gql_limit"] = rl.get("cost"), rl.get("remaining"), rl.get("limit")
              data = obj.get("data") if isinstance(obj, dict) and isinstance(obj.get("data"), dict) else {}
              return rec, data


          def emit(label, try_, rec, texts):
              rec = dict(label=label, t=try_, **rec)
              rec["texts"] = texts
              print(json.dumps(rec), flush=True)


          def run(label, fn, tries=TRIES):
              for t in range(tries):
                  try:
                      rec, texts = fn()
                  except Exception as e:  # a read that fails in this script is recorded and the run goes on
                      rec, texts = {"shape": "script-error", "error": type(e).__name__}, []
                  emit(label, t, rec, texts)
                  time.sleep(1.0)


          RL = "rateLimit { cost remaining limit }"


          def issues(numbers):
              def fn():
                  parts = " ".join("i%d: issue(number: %d) { number bodyHTML }" % (n, n) for n in numbers)
                  q = 'query { repository(owner: "%s", name: "%s") { %s } %s }' % (OWNER, NAME, parts, RL)
                  rec, data = graphql(q)
                  repo = data.get("repository") or {}
                  return rec, [hashes("i%d" % n, (repo.get("i%d" % n) or {}).get("bodyHTML")) for n in numbers if repo]
              return fn


          PAGE = """
          query($owner: String!, $name: String!, $first: Int!) {
            repository(owner: $owner, name: $name) {
              issues(first: $first, orderBy: {field: ORDER, direction: DIRECTION}) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  number body bodyHTML state stateReason(enableDuplicate: true)
                  createdAt closedAt
                  author { __typename login }
                  labels(first: 20) { nodes { name } }
                  comments { totalCount }
                  closedByPullRequestsReferences(first: 5, includeClosedPrs: true) {
                    nodes { number merged repository { nameWithOwner } }
                  }
                  timelineItems(itemTypes: [CLOSED_EVENT], last: 1) {
                    nodes { ... on ClosedEvent { closer { ... on PullRequest { number } } } }
                  }
                }
              }
            }
            RL
          }
          """


          def page(first, order, direction):
              def fn():
                  q = PAGE.replace("ORDER", order).replace("DIRECTION", direction).replace("RL", RL)
                  rec, data = graphql(q, {"owner": OWNER, "name": NAME, "first": first})
                  nodes = ((data.get("repository") or {}).get("issues") or {}).get("nodes") or []
                  return rec, [hashes("i%d" % (n.get("number") or 0), n.get("bodyHTML")) for n in nodes]
              return fn


          def rest_issue(n):
              def fn():
                  rec, obj = request("GET", "%s/issues/%d" % (R, n), HTML)
                  ok = isinstance(obj, dict) and rec.get("status") == 200
                  return rec, [hashes("i%d" % n, obj.get("body_html"))] if ok else []
              return fn


          def rest_list(query, prefix):
              def fn():
                  rec, obj = request("GET", R + query, HTML)
                  items = obj if isinstance(obj, list) else []
                  return rec, [hashes(prefix % (item.get("number") if prefix == "i%d" else i + 1), item.get("body_html"))
                               for i, item in enumerate(items)]
              return fn


          def comments_window(n, first, after_index, cursors):
              def fn():
                  after = ""
                  if after_index:
                      if len(cursors) < after_index:
                          return {"shape": "no-cursor"}, []
                      after = ', after: "%s"' % cursors[after_index - 1]
                  q = ('query { repository(owner: "%s", name: "%s") { issue(number: %d) { comments(first: %d%s) '
                       '{ nodes { bodyHTML } } } } %s }' % (OWNER, NAME, n, first, after, RL))
                  rec, data = graphql(q)
                  nodes = ((((data.get("repository") or {}).get("issue") or {}).get("comments") or {}).get("nodes")) or []
                  return rec, [hashes("c%d" % (after_index + i + 1), c.get("bodyHTML")) for i, c in enumerate(nodes)]
              return fn


          def cursors_of(n):
              q = ('query { repository(owner: "%s", name: "%s") { issue(number: %d) { comments(first: 100) '
                   '{ edges { cursor } } } } %s }' % (OWNER, NAME, n, RL))
              rec, data = graphql(q)
              edges = ((((data.get("repository") or {}).get("issue") or {}).get("comments") or {}).get("edges")) or []
              emit("comment cursors of #%d" % n, 0, rec, [len(edges)])
              return [e.get("cursor") for e in edges]


          DISCUSSION = """
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              discussion(number: $number) {
                id number title body bodyHTML createdAt closed locked isAnswered
                authorAssociation
                author { __typename login }
                category { name isAnswerable }
                comments(first: 50) {
                  totalCount
                  nodes {
                    body bodyHTML createdAt authorAssociation
                    isMinimized minimizedReason
                    author { __typename login }
                    replies(first: 20) {
                      nodes {
                        body bodyHTML createdAt authorAssociation
                        isMinimized minimizedReason
                        author { __typename login }
                      }
                    }
                  }
                }
              }
            }
            RL
          }
          """


          def discussion(n):
              def fn():
                  rec, data = graphql(DISCUSSION.replace("RL", RL), {"owner": OWNER, "name": NAME, "number": n})
                  d = (data.get("repository") or {}).get("discussion")
                  if not d:
                      return rec, []
                  out = [hashes("d", d.get("bodyHTML"))]
                  for i, c in enumerate((d.get("comments") or {}).get("nodes") or []):
                      out.append(hashes("dc%d" % (i + 1), c.get("bodyHTML")))
                  return rec, out
              return fn


          def rate_limits(label):
              rec, obj = request("GET", "/rate_limit")
              res = (obj or {}).get("resources") or {} if isinstance(obj, dict) else {}
              rec["core"] = [(res.get("core") or {}).get(k) for k in ("remaining", "limit")]
              rec["graphql"] = [(res.get("graphql") or {}).get(k) for k in ("remaining", "limit")]
              emit(label, 0, rec, [])


          def main():
              only = sys.argv[1] if len(sys.argv) > 1 else "all"
              rate_limits("rate limits before")
              if only in ("all", "gql"):
                  run("gql aliases 5 smallest", issues([1, 2, 3, 4, 5]))
                  run("gql aliases one of each kind", issues([1, 7, 11, 15, 19, 23, 27, 31]))
                  run("gql aliases 48 MB, the largest that answered 3 of 3",
                      issues([7, 8, 9, 10, 31, 32, 33, 34, 15, 16, 17, 27, 1, 2, 3, 4, 5, 6]))
                  run("gql aliases 39 MB with both wide tables, the smallest that failed 2 of 2", issues([8, 9, 10, 36, 37]))
                  run("gql aliases 66 MB, all but the wide tables, cut off 2 of 2",
                      issues([7, 8, 9, 10, 31, 32, 33, 34, 15, 16, 17, 18, 23, 24, 25, 26, 11, 12, 13, 14,
                              27, 28, 29, 30, 19, 20, 21, 22, 1, 2, 3, 4, 5, 6]))
                  run("gql issues first=10 created ascending", page(10, "CREATED_AT", "ASC"))
                  run("gql issues first=10 updated descending (the assistant's order)", page(10, "UPDATED_AT", "DESC"))
              if only in ("all", "rest"):
                  for n in (1, 7, 11, 15, 19, 23, 27, 31, 36):
                      run("rest html issue %d" % n, rest_issue(n))
                  run("rest html list per_page=30 (newest first)", rest_list("/issues?state=all&per_page=30", "i%d"))
                  run("rest html list per_page=30 created ascending",
                      rest_list("/issues?state=all&sort=created&direction=asc&per_page=30", "i%d"))
                  run("rest html comments of 6 per_page=30", rest_list("/issues/6/comments?per_page=30", "c%d"))
                  run("rest html comments of 6 per_page=100", rest_list("/issues/6/comments?per_page=100", "c%d"))
              if only in ("all", "comments"):
                  cursors = cursors_of(6)
                  run("gql comments of 6 first=10", comments_window(6, 10, 0, cursors))
                  run("gql comments of 6 first=10 after the 10th", comments_window(6, 10, 10, cursors))
                  run("gql comments of 6 first=5 after the 5th", comments_window(6, 5, 5, cursors))
              if only in ("all", "discussion"):
                  run("gql discussion 38 as the assistant asks, with bodyHTML", discussion(38))
              rate_limits("rate limits after")


          main()
          PY
